x-release-environment: &release-environment
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_URL: ${RELEASE_APP_URL:-http://localhost:18081}
  FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
  LOG_CHANNEL: stderr
  LOG_LEVEL: info
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: ${DB_DATABASE:?DB_DATABASE must identify an isolated release database}
  DB_USERNAME: ${DB_USERNAME:-rifas_release}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  CACHE_STORE: redis
  SESSION_DRIVER: database
  QUEUE_CONNECTION: database
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  MAIL_MAILER: log

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required}
      POSTGRES_USER: ${DB_USERNAME:-rifas_release}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - release_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-rifas_release} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - release_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  release-migrate:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.release
    environment: *release-environment
    command: ["php", "artisan", "migrate", "--force"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  release-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.release
    environment: *release-environment
    depends_on:
      release-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          SCRIPT_NAME=/up SCRIPT_FILENAME=/var/www/html/public/index.php
          REQUEST_METHOD=GET REQUEST_URI=/up SERVER_NAME=localhost
          SERVER_PORT=80 SERVER_PROTOCOL=HTTP/1.1
          cgi-fcgi -bind -connect 127.0.0.1:9000
          | grep -q "Application up"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  release-web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile.release
    ports:
      - "${RELEASE_HTTP_PORT:-18081}:80"
    depends_on:
      release-app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up | grep -q 'Application up'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  release_postgres_data:
  release_redis_data:
